<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#fff;overflow:hidden}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head><body>
<script>const PECAS=[];</script>
<script type="module">
import * as THREE from 'three';
import {STLLoader} from 'three/addons/loaders/STLLoader.js';
const W=innerWidth,H=innerHeight;
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
renderer.setSize(W,H);renderer.setPixelRatio(1);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;renderer.outputColorSpace=THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0xd9dbdc);
const cam=new THREE.PerspectiveCamera(32,W/H,1,3000);
// luzes
scene.add(new THREE.HemisphereLight(0xffffff,0x8a7a66,0.55));
const key=new THREE.DirectionalLight(0xfff2e0,2.2);key.position.set(-180,320,420);key.castShadow=true;
key.shadow.mapSize.set(2048,2048);Object.assign(key.shadow.camera,{left:-220,right:220,top:260,bottom:-60,near:50,far:1200});key.shadow.bias=-0.0005;key.shadow.radius=4;scene.add(key);
const fill=new THREE.DirectionalLight(0xe0ecff,0.8);fill.position.set(300,150,250);scene.add(fill);
const rim=new THREE.DirectionalLight(0xffffff,0.6);rim.position.set(0,200,-400);scene.add(rim);
// mesa de madeira (textura procedural) e parede de chapa com frisos
function madeira(){const c=document.createElement('canvas');c.width=1024;c.height=1024;const g=c.getContext('2d');
 g.fillStyle='#c9a06a';g.fillRect(0,0,1024,1024);
 for(let i=0;i<400;i++){g.strokeStyle=`rgba(${110+Math.random()*40},${70+Math.random()*30},${30+Math.random()*20},${0.12+Math.random()*0.18})`;g.lineWidth=1+Math.random()*3;g.beginPath();const y=Math.random()*1024;g.moveTo(0,y);for(let x=0;x<=1024;x+=64)g.lineTo(x,y+Math.sin(x/90+i)*6+(Math.random()-0.5)*3);g.stroke();}
 for(let k=1;k<4;k++){g.fillStyle='rgba(60,35,15,0.35)';g.fillRect(0,k*256-1,1024,2);}
 const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(2,2);return t;}
const mesa=new THREE.Mesh(new THREE.PlaneGeometry(1600,1600),new THREE.MeshStandardMaterial({map:madeira(),roughness:0.55,metalness:0.05}));
mesa.rotation.x=-Math.PI/2;mesa.receiveShadow=true;scene.add(mesa);
const paredeMat=new THREE.MeshStandardMaterial({color:0xb9bdc0,roughness:0.9});
const parede=new THREE.Group();for(let x=-900;x<900;x+=60){const f=new THREE.Mesh(new THREE.BoxGeometry(50,1400,8),paredeMat);f.position.set(x,700,-250);f.receiveShadow=true;parede.add(f);
 const r=new THREE.Mesh(new THREE.BoxGeometry(12,1400,3),new THREE.MeshStandardMaterial({color:0x9ea3a6,roughness:0.9}));r.position.set(x+30,700,-252);parede.add(r);}scene.add(parede);
// peças
const cores={verde:0x149a52,vermelho:0xd81f3e};
const loader=new STLLoader();const grupo=new THREE.Group();scene.add(grupo);
const hdr=new THREE.Box3();
for(const p of PECAS){const bin=Uint8Array.from(atob(p.b64),c=>c.charCodeAt(0)).buffer;const geo=loader.parse(bin);geo.computeVertexNormals();
 // z (altura da árvore) -> y da cena; letras de frente para +z
 geo.rotateX(-Math.PI/2);
 const mat=new THREE.MeshStandardMaterial({color:cores[p.cor],roughness:0.72,metalness:0.0});
 const m=new THREE.Mesh(geo,mat);m.castShadow=true;m.receiveShadow=true;grupo.add(m);hdr.expandByObject(m);}
const c=hdr.getCenter(new THREE.Vector3()),s=hdr.getSize(new THREE.Vector3());
grupo.position.set(-c.x,-hdr.min.y+0.01,-c.z+15);
const alvo=new THREE.Vector3(0,s.y*0.47,0);const dist=Math.max(s.x,s.y)*2.25+40;
window.__frame=(a)=>{cam.position.set(Math.sin(a)*dist,s.y*0.62+Math.cos(a*0)*0,Math.cos(a)*dist);cam.lookAt(alvo);renderer.render(scene,cam);};
window.__angulo=(a,elev)=>{cam.position.set(Math.sin(a)*dist,elev,Math.cos(a)*dist);cam.lookAt(alvo);renderer.render(scene,cam);};
window.__frame(0);window.__ready=true;
</script></body></html>
